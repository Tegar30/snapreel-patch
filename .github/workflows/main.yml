name: Build and Release SnapReel

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPREEL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SNAPREEL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SNAPREEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SNAPREEL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::SNAPREEL_KEYSTORE_BASE64 is not configured"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::SNAPREEL_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::SNAPREEL_KEY_ALIAS is not configured"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::SNAPREEL_KEY_PASSWORD is not configured"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/snapreel-release.p12"

      - name: Run tests and build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:testDebugUnitTest assembleDebug --stacktrace

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPREEL_KEYSTORE_FILE: ${{ runner.temp }}/snapreel-release.p12
          SNAPREEL_KEYSTORE_PASSWORD: ${{ secrets.SNAPREEL_KEYSTORE_PASSWORD }}
          SNAPREEL_KEY_ALIAS: ${{ secrets.SNAPREEL_KEY_ALIAS }}
          SNAPREEL_KEY_PASSWORD: ${{ secrets.SNAPREEL_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapReel-${{ startsWith(github.ref, 'refs/tags/v') && 'Release' || 'Debug' }}-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

